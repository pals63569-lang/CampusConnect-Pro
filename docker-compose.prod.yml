version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: campusconnect-pro:latest
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/campusconnect_prod
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=prod_super_secret_jwt_key_998877665544
      - JWT_REFRESH_SECRET=prod_super_secret_refresh_key_1122334455
      - CORS_ORIGIN=*
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - campus_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: campusconnect_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/app/uploads:ro
    depends_on:
      - api
    networks:
      - campus_network

  mongodb:
    image: mongo:6.0
    container_name: campusconnect_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_prod_data:/data/db
    networks:
      - campus_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campusconnect_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    networks:
      - campus_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  campus_network:
    driver: bridge

volumes:
  mongo_prod_data:
  redis_prod_data:
