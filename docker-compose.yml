version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/campusconnect_pro
      - JWT_SECRET=super_secret_jwt_key_campus_connect_pro_2026
      - JWT_REFRESH_SECRET=super_secret_refresh_key_campus_connect_pro_2026
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data:
