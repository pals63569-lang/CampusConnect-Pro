apiVersion: v1
kind: ConfigMap
metadata:
  name: campusconnect-config
  namespace: campusconnect
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "https://campusconnect.edu"
  MONGODB_URI: "mongodb://mongodb.campusconnect.svc.cluster.local:27017/campusconnect_prod"
  REDIS_HOST: "redis.campusconnect.svc.cluster.local"
  REDIS_PORT: "6379"
