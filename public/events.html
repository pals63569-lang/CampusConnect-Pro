<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events Directory | CampusConnect-Pro</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Glow Backgrounds -->
  <div class="hero-bg-glow"></div>
  <div class="hero-bg-glow-2"></div>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg glass-nav navbar-dark py-3">
    <div class="container">
      <a class="navbar-brand fw-extrabold fs-3 d-flex align-items-center gap-2" href="/">
        <i class="fas fa-cubes text-primary"></i>
        <span>Campus<span class="gradient-text">Connect</span></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center gap-3">
          <li class="nav-item"><a class="nav-link fw-semibold" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold" href="/events.html">Events</a></li>
          <li class="nav-item">
            <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle Theme">
              <i class="fas fa-sun"></i>
            </button>
          </li>
          <div id="navbar-auth-section" class="d-flex align-items-center gap-2 list-unstyled"></div>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Title Banner -->
  <section class="py-5 text-center">
    <div class="container">
      <h1 class="display-4 fw-extrabold mb-2">Campus <span class="gradient-text">Events Directory</span></h1>
      <p class="text-secondary">Explore tech hackathons, cultural nights, sports meets, and hands-on workshops.</p>
    </div>
  </section>

  <!-- Filter & Search Board -->
  <section class="pb-5">
    <div class="container">
      <div class="row g-4">
        <!-- Sidebar Filters -->
        <div class="col-lg-3">
          <div class="glass-card p-4">
            <h5 class="fw-bold mb-4"><i class="fas fa-sliders-h text-primary me-2"></i> Filter Events</h5>
            
            <div class="mb-4">
              <label class="form-label text-secondary small fw-semibold">Search Keywords</label>
              <div class="search-container-relative">
                <input type="text" id="filter-search" class="form-control glass-input" placeholder="Title, speaker, venue..." autocomplete="off">
                <span id="search-spinner" class="search-loader d-none"><i class="fas fa-circle-notch fa-spin"></i></span>
                <div id="search-suggestions" class="search-suggestions-dropdown d-none"></div>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label text-secondary small fw-semibold">Category</label>
              <select id="filter-category" class="form-select glass-input">
                <option value="">All Categories</option>
                <option value="Technical">Technical</option>
                <option value="Cultural">Cultural</option>
                <option value="Sports">Sports</option>
                <option value="Workshop">Workshop</option>
                <option value="Seminar">Seminar</option>
              </select>
            </div>

            <div class="mb-4">
              <label class="form-label text-secondary small fw-semibold">Department</label>
              <select id="filter-department" class="form-select glass-input">
                <option value="">All Departments</option>
              </select>
            </div>

            <div class="mb-4">
              <label class="form-label text-secondary small fw-semibold">Format</label>
              <select id="filter-mode" class="form-select glass-input">
                <option value="">All Formats</option>
                <option value="Online">Online</option>
                <option value="Offline">Offline</option>
                <option value="Hybrid">Hybrid</option>
              </select>
            </div>

            <div class="mb-4">
              <label class="form-label text-secondary small fw-semibold">Cost</label>
              <select id="filter-is-free" class="form-select glass-input">
                <option value="">All Prices</option>
                <option value="true">Free</option>
                <option value="false">Paid</option>
              </select>
            </div>

            <div class="mb-4">
              <label class="form-label text-secondary small fw-semibold">Venue / Location</label>
              <input type="text" id="filter-venue" class="form-control glass-input" placeholder="e.g. Auditorium">
            </div>

            <div class="mb-3">
              <label class="form-label text-secondary small fw-semibold">Start Date</label>
              <input type="date" id="filter-start-date" class="form-control glass-input">
            </div>

            <div class="mb-4">
              <label class="form-label text-secondary small fw-semibold">End Date</label>
              <input type="date" id="filter-end-date" class="form-control glass-input">
            </div>

            <div class="mb-4">
              <label class="form-label text-secondary small fw-semibold">Sort By</label>
              <select id="filter-sort-by" class="form-select glass-input">
                <option value="date">Nearest Date First</option>
                <option value="dateDesc">Furthest Date First</option>
                <option value="popularity">Popularity (Views)</option>
                <option value="rating">Average Rating</option>
                <option value="title">Alphabetical (A-Z)</option>
              </select>
            </div>

            <div class="mb-4">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="filter-upcoming">
                <label class="form-check-label text-secondary small fw-semibold" for="filter-upcoming">Upcoming Only</label>
              </div>
            </div>

            <button id="btn-clear-filters" class="btn btn-outline-glass w-100 btn-sm">Clear All Filters</button>
          </div>
        </div>

        <!-- Event Cards List -->
        <div class="col-lg-9">
          <div class="row g-4" id="events-grid-container">
            <!-- Loading Skeletons -->
            <div class="col-md-6">
              <div class="glass-card p-3">
                <div class="skeleton" style="height: 180px; border-radius: 12px; margin-bottom: 15px;"></div>
                <div class="skeleton" style="height: 20px; width: 40%; margin-bottom: 10px;"></div>
                <div class="skeleton" style="height: 28px; width: 85%; margin-bottom: 15px;"></div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="glass-card p-3">
                <div class="skeleton" style="height: 180px; border-radius: 12px; margin-bottom: 15px;"></div>
                <div class="skeleton" style="height: 20px; width: 40%; margin-bottom: 10px;"></div>
                <div class="skeleton" style="height: 28px; width: 85%; margin-bottom: 15px;"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="text-center py-4 border-top border-secondary bg-secondary-subtle">
    <p class="mb-0 text-muted small">&copy; 2026 CampusConnect-Pro. All rights reserved.</p>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/main.js"></script>
  
  <script>
    renderNavbar();

    const gridContainer = document.getElementById('events-grid-container');
    const searchInput = document.getElementById('filter-search');
    const categorySelect = document.getElementById('filter-category');
    const deptSelect = document.getElementById('filter-department');
    const modeSelect = document.getElementById('filter-mode');
    const freeSelect = document.getElementById('filter-is-free');
    const venueInput = document.getElementById('filter-venue');
    const startDateInput = document.getElementById('filter-start-date');
    const endDateInput = document.getElementById('filter-end-date');
    const sortBySelect = document.getElementById('filter-sort-by');
    const upcomingToggle = document.getElementById('filter-upcoming');
    const clearBtn = document.getElementById('btn-clear-filters');

    // Parse URL params for pre-filled filters
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('search')) searchInput.value = urlParams.get('search');
    if (urlParams.get('category')) categorySelect.value = urlParams.get('category');
    if (urlParams.get('department')) deptSelect.value = urlParams.get('department');
    if (urlParams.get('mode')) modeSelect.value = urlParams.get('mode');
    if (urlParams.get('isFree')) freeSelect.value = urlParams.get('isFree');
    if (urlParams.get('timeframe') === 'upcoming') upcomingToggle.checked = true;

    async function fetchEvents() {
      try {
        gridContainer.innerHTML = `
          <div class="col-12 text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-secondary mt-2 small">Fetching directory catalog...</p>
          </div>
        `;

        const search = searchInput.value;
        const category = categorySelect.value;
        const dept = deptSelect.value;
        const mode = modeSelect.value;
        const isFree = freeSelect.value;
        const venue = venueInput.value;
        const startDate = startDateInput.value;
        const endDate = endDateInput.value;
        const sortBy = sortBySelect.value;
        const upcoming = upcomingToggle.checked;

        const queryParams = new URLSearchParams();
        if (search) queryParams.append('search', search);
        if (category) queryParams.append('category', category);
        if (dept) queryParams.append('department', dept);
        if (mode) queryParams.append('mode', mode);
        if (isFree !== '') queryParams.append('isFree', isFree);
        if (venue) queryParams.append('venue', venue);
        if (startDate) queryParams.append('startDate', startDate);
        if (endDate) queryParams.append('endDate', endDate);
        if (sortBy) queryParams.append('sortBy', sortBy);
        if (upcoming) queryParams.append('timeframe', 'upcoming');

        const res = await fetch(`${API_URL}/events?${queryParams.toString()}`);
        const data = await res.json();

        if (data.success && data.events.length > 0) {
          gridContainer.innerHTML = '';
          data.events.forEach(event => {
            const dateStr = formatDate(event.date);
            const imageSrc = event.banner || 'https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?w=500';
            
            const isFeatured = event.isFeatured === true;
            const isTrending = event.isTrending === true;

            let cardClass = '';
            let overlayHtml = '';
            let extraBadge = '';

            if (isFeatured) {
              cardClass = 'featured-card';
              overlayHtml = '<div class="featured-glow-overlay"></div>';
              extraBadge = '<span class="badge featured-badge-glow ms-2"><i class="fas fa-star me-1"></i>Featured</span>';
            } else if (isTrending) {
              cardClass = 'trending-card';
              overlayHtml = '<div class="trending-glow-overlay"></div>';
              extraBadge = '<span class="badge trending-badge-glow ms-2"><i class="fas fa-fire me-1"></i>Trending</span>';
            }

            if (event.availableSeats === 0) {
              extraBadge += '<span class="badge bg-danger ms-2"><i class="fas fa-ban me-1"></i>Fully Booked</span>';
            }
            
            gridContainer.innerHTML += `
              <div class="col-md-6">
                <div class="glass-card h-100 overflow-hidden d-flex flex-column ${cardClass}">
                  <div class="position-relative overflow-hidden" style="height: 180px;">
                    <img src="${imageSrc}" class="card-img-top w-100 h-100" alt="${event.title}" style="object-fit: cover;">
                    ${overlayHtml}
                  </div>
                  <div class="card-body p-4 d-flex flex-column flex-grow-1">
                    <div class="mb-2">
                      <span class="category-badge category-${event.category.toLowerCase()}">${event.category}</span>
                      <span class="badge bg-secondary ms-2">${event.status}</span>
                      ${extraBadge}
                    </div>
                    <h5 class="card-title fw-bold text-white mb-2">${event.title}</h5>
                    <p class="card-text text-secondary mb-4 small flex-grow-1">${event.description.substring(0, 150)}...</p>
                    <div class="border-top border-secondary pt-3 mt-auto">
                      <div class="row g-2 text-muted small mb-3">
                        <div class="col-6"><i class="far fa-calendar-alt me-1"></i> ${dateStr}</div>
                        <div class="col-6 text-end"><i class="fas fa-map-marker-alt me-1"></i> ${event.venue}</div>
                        <div class="col-6"><i class="fas fa-chair me-1"></i> Seats: ${event.availableSeats}/${event.capacity}</div>
                      </div>
                      <a href="/event-detail.html?id=${event._id}" class="btn btn-glow w-100 btn-sm">View Details</a>
                    </div>
                  </div>
                </div>
              </div>
            `;
          });
        } else {
          gridContainer.innerHTML = `
            <div class="col-12 text-center py-5">
              <i class="far fa-calendar-times fa-3x text-secondary mb-3"></i>
              <h5 class="fw-bold text-white">No Events Found</h5>
              <p class="text-secondary small">Try adjusting your filters or search tags.</p>
            </div>
          `;
        }
      } catch (err) {
        console.error(err);
        gridContainer.innerHTML = `<div class="col-12 text-center py-5 text-danger">Failed to connect to events database.</div>`;
      }
    }

    const suggestionsContainer = document.getElementById('search-suggestions');
    const searchSpinner = document.getElementById('search-spinner');

    // Fetch and display search suggestions
    async function showSuggestions() {
      const query = searchInput.value.trim();
      if (query.length < 2) {
        suggestionsContainer.classList.add('d-none');
        suggestionsContainer.innerHTML = '';
        return;
      }

      searchSpinner.classList.remove('d-none');

      try {
        const res = await fetch(`${API_URL}/events/suggestions?q=${encodeURIComponent(query)}`);
        const data = await res.json();
        
        searchSpinner.classList.add('d-none');

        if (data.success && data.suggestions.length > 0) {
          suggestionsContainer.innerHTML = '';
          suggestionsContainer.classList.remove('d-none');
          
          data.suggestions.forEach(item => {
            const titleHtml = highlightText(item.title, query);
            const categoryHtml = highlightText(item.category, query);
            
            const div = document.createElement('div');
            div.className = 'suggestion-item';
            div.innerHTML = `
              <div>
                <div class="suggestion-title text-white">${titleHtml}</div>
                <small class="text-secondary" style="font-size: 0.75rem;">Speaker: ${item.speaker || 'N/A'}</small>
              </div>
              <span class="suggestion-meta">${categoryHtml}</span>
            `;
            
            div.addEventListener('click', () => {
              searchInput.value = item.title;
              suggestionsContainer.classList.add('d-none');
              fetchEvents();
            });
            
            suggestionsContainer.appendChild(div);
          });
        } else {
          suggestionsContainer.classList.add('d-none');
        }
      } catch (err) {
        console.error(err);
        searchSpinner.classList.add('d-none');
      }
    }

    function highlightText(text, searchWord) {
      if (!text || !searchWord) return text || '';
      const regex = new RegExp(`(${escapeRegExp(searchWord)})`, 'gi');
      return text.replace(regex, '<span class="highlight-match">$1</span>');
    }

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // Bind event listeners
    searchInput.addEventListener('input', debounce(fetchEvents, 400));
    searchInput.addEventListener('input', debounce(showSuggestions, 200));
    categorySelect.addEventListener('change', fetchEvents);
    deptSelect.addEventListener('change', fetchEvents);
    modeSelect.addEventListener('change', fetchEvents);
    freeSelect.addEventListener('change', fetchEvents);
    venueInput.addEventListener('input', debounce(fetchEvents, 400));
    startDateInput.addEventListener('change', fetchEvents);
    endDateInput.addEventListener('change', fetchEvents);
    sortBySelect.addEventListener('change', fetchEvents);
    upcomingToggle.addEventListener('change', fetchEvents);
    
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      categorySelect.value = '';
      deptSelect.value = '';
      modeSelect.value = '';
      freeSelect.value = '';
      venueInput.value = '';
      startDateInput.value = '';
      endDateInput.value = '';
      sortBySelect.value = 'date';
      upcomingToggle.checked = false;
      suggestionsContainer.classList.add('d-none');
      fetchEvents();
    });

    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !suggestionsContainer.contains(e.target)) {
        suggestionsContainer.classList.add('d-none');
      }
    });

    // Fetch and populate departments list
    async function loadDepartments() {
      try {
        const res = await fetch(`${API_URL}/departments`);
        const data = await res.json();
        if (data.success && deptSelect) {
          deptSelect.innerHTML = '<option value="">All Departments</option>';
          data.departments.forEach(dept => {
            deptSelect.innerHTML += `<option value="${dept._id}">${dept.name}</option>`;
          });
          
          const deptParam = urlParams.get('department');
          if (deptParam) {
            deptSelect.value = deptParam;
            fetchEvents();
          }
        }
      } catch (err) {
        console.error('Failed to load departments', err);
      }
    }

    // Helper debounce function
    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    // Initial Load
    loadDepartments();
    fetchEvents();
  </script>
</body>
</html>
