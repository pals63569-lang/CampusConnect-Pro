<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email | CampusConnect-Pro</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Glow Backgrounds -->
  <div class="hero-bg-glow"></div>
  <div class="hero-bg-glow-2"></div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg glass-nav navbar-dark py-3">
    <div class="container">
      <a class="navbar-brand fw-extrabold fs-3 d-flex align-items-center gap-2" href="/">
        <i class="fas fa-cubes text-primary"></i>
        <span>Campus<span class="gradient-text">Connect</span></span>
      </a>
    </div>
  </nav>

  <!-- Verify Area -->
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container" style="max-width: 450px;">
      <div class="glass-card p-5">
        <div class="text-center mb-4">
          <i class="fas fa-envelope-open-text fa-3x text-primary mb-3"></i>
          <h2 class="fw-bold">Verify Account</h2>
          <p class="text-secondary small">A 6-digit OTP code has been dispatched to your email.</p>
        </div>

        <form id="verify-form">
          <div class="mb-3">
            <label for="verify-email" class="form-label text-secondary small fw-semibold">Email Address</label>
            <input type="email" id="verify-email" class="form-control glass-input" placeholder="name@college.edu" required readonly>
          </div>
          <div class="mb-4">
            <label for="verify-otp" class="form-label text-secondary small fw-semibold">6-Digit OTP Code</label>
            <input type="text" id="verify-otp" class="form-control glass-input text-center fs-4 letter-spacing-4" placeholder="000000" maxlength="6" required>
          </div>
          <button type="submit" class="btn btn-glow w-100 py-3 mb-3">Verify Account</button>
        </form>

        <div class="text-center text-secondary small mt-3">
          Need help? <a href="/login.html" class="text-primary text-decoration-none">Back to Login</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center py-3 border-top border-secondary mt-auto bg-secondary-subtle">
    <p class="mb-0 text-muted small">&copy; 2026 CampusConnect-Pro. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
