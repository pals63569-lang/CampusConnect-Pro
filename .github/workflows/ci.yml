name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-security:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & ESLint
        run: npm run lint

      - name: Dependency Security Audit
        run: npm audit --audit-level=high || true

  unit-and-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-security
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Test Suite with Coverage
        env:
          NODE_ENV: test
          PORT: 3001
          MONGODB_URI: mongodb://localhost:27017/campusconnect_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_pipeline_jwt_secret_key_2026
          JWT_EXPIRES_IN: 1d
          JWT_REFRESH_SECRET: ci_pipeline_jwt_refresh_secret_key_2026
          JWT_REFRESH_EXPIRES_IN: 7d
        run: npm test

  docker-build:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: campusconnect-pro:latest
